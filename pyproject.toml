[project]
name = "ledger"
version = "0.1.0"
description = "Decision-memory graph over AI chat exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "falkordb>=1.1.0",
  "mcp>=1.2.0,<2",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*"]
